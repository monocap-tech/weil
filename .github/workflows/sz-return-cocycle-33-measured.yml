name: SZ Return Cocycle 33 N0 Measured Certificate

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - ".github/workflows/sz-return-cocycle-33-measured.yml"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run corrected N0 exact certificate
        run: python experiments/sz_return_cocycle_33_n0_reflection_sector_invertibility.py
