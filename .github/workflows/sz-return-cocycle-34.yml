name: SZ Return Cocycle 34 Second Nu Discovery

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - "experiments/sz_return_cocycle_34_second_nu_tier_discover.py"
      - ".github/workflows/sz-return-cocycle-34.yml"

concurrency:
  group: sz-return-cocycle-34-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run second nu-tier discovery
        run: python experiments/sz_return_cocycle_34_second_nu_tier_discover.py
