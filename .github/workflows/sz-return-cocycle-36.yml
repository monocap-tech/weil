name: SZ Return Cocycle 36 Fast Overlap Probe

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - ".github/workflows/sz-return-cocycle-36.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure failed fixed-U overlap
        run: python experiments/sz_return_cocycle_36_overlap_probe.py
