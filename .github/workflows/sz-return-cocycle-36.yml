name: SZ Return Cocycle 36 Third Nu Tier Certificate

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - ".github/workflows/sz-return-cocycle-36.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify third nu-tier seam
        run: python experiments/sz_return_cocycle_36_third_nu_tier_discover.py
