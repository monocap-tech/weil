name: SZ Return Cocycle 42 Fast Orbit Probe

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - ".github/workflows/sz-return-cocycle-42.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe sixth nu-tier orbit
        run: python experiments/sz_return_cocycle_42_orbit_probe.py
