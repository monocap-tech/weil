name: SZ Return Cocycle 42 Sixth Nu Tier Certificate

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - ".github/workflows/sz-return-cocycle-42.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify sixth nu-tier seam
        run: python experiments/sz_return_cocycle_42_sixth_nu_tier_discover.py
