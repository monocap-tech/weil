name: SZ Return Cocycle 44 Seventh Nu Tier Certificate

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - .github/workflows/sz-return-cocycle-44.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify seventh nu-tier seam
        run: python experiments/sz_return_cocycle_44_seventh_nu_tier_discover.py
