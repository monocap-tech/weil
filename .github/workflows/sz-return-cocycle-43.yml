name: SZ Return Cocycle 43 N5 Parallel Certificate

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - ".github/workflows/sz-return-cocycle-43.yml"

jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sector: [plus, minus]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run ${{ matrix.sector }} N5 sector certificate
        run: python experiments/sz_return_cocycle_43_n5_reflection_sector_invertibility.py ${{ matrix.sector }}
