name: SZ Return Cocycle 31 O0 Certificate

on:
  push:
    branches:
      - research/sz-return-cocycle-0
    paths:
      - "experiments/sz_return_cocycle_31_o0_reflection_sector_invertibility.py"
      - ".github/workflows/sz-return-cocycle-31.yml"

concurrency:
  group: sz-return-cocycle-31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run O0 exact certificate
        run: python experiments/sz_return_cocycle_31_o0_reflection_sector_invertibility.py
